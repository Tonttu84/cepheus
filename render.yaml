# Hosted demo on Render (Frankfurt, EU), simulated data only.
# Render > New > Blueprint > this repository creates the database and the web service.
# The seed runs on every start, so a restart (or the free plan's wake-up after idle)
# puts the sample patients back to their seeded state, like the demo page's reset.
services:
  - type: web
    name: cepheus-demo
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma db push --skip-generate && npx tsx prisma/seed.ts && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cepheus-db
          property: connectionString
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: DEMO_SESSION_ENABLED
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"

databases:
  - name: cepheus-db
    region: frankfurt
    plan: free
    databaseName: cepheus
    user: cepheus
